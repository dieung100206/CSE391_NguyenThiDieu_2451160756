<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Todo App</h1>

    <div class="input-group">
        <input
            type="text"
            id="todoInput"
            placeholder="Nhập công việc..."
        >
        <button id="addBtn">Add</button>
    </div>

    <ul id="todoList"></ul>

    <div class="footer">
        <span id="count">0 items left</span>

        <div class="filters">
            <button data-filter="all" class="filter active">
                All
            </button>

            <button data-filter="active" class="filter">
                Active
            </button>

            <button data-filter="completed" class="filter">
                Completed
            </button>
        </div>

        <button id="clearCompleted">
            Clear Completed
        </button>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
