<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="layout">

        <!-- HEADER -->
        <header>
            <h1>My E-Commerce</h1>
        </header>

        <!-- HERO -->
        <section class="hero">
            <div class="hero-card">
                <h2>Sản phẩm nổi bật</h2>
                <p>Giảm giá đến 50%</p>
            </div>

            <div class="hero-small">
                Flash Sale
            </div>

            <div class="hero-small">
                New Collection
            </div>
        </section>

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>Bộ lọc</h2>

            <label>
                <input type="checkbox">
                Điện thoại
            </label>

            <label>
                <input type="checkbox">
                Laptop
            </label>

            <label>
                <input type="checkbox">
                Tai nghe
            </label>

            <label>
                <input type="checkbox">
                Đồng hồ
            </label>

        </aside>

        <!-- MAIN -->
        <main class="main-content">

            <div class="product-card">
                <img src="https://via.placeholder.com/250x150" alt="">
                <h3>Sản phẩm 1</h3>
                <p>300.000đ</p>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250x150" alt="">
                <h3>Sản phẩm 2</h3>
                <p>400.000đ</p>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250x150" alt="">
                <h3>Sản phẩm 3</h3>
                <p>500.000đ</p>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250x150" alt="">
                <h3>Sản phẩm 4</h3>
                <p>600.000đ</p>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250x150" alt="">
                <h3>Sản phẩm 5</h3>
                <p>700.000đ</p>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250x150" alt="">
                <h3>Sản phẩm 6</h3>
                <p>800.000đ</p>
            </div>

        </main>

        <!-- ADS -->
        <aside class="ads">
            <img src="https://via.placeholder.com/180x600" alt="">
        </aside>

        <!-- FOOTER -->
        <footer>
            <p>© 2026 My E-Commerce</p>
        </footer>

    </div>

</body>
</html>
