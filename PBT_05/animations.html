<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations Demo</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <header>
        <h1>CSS Animations & Transitions</h1>
    </header>

    <!-- Loading Spinner -->
    <section>
        <h2>Loading Spinner</h2>
        <div class="spinner"></div>
    </section>

    <!-- Product Cards -->
    <section class="products">

        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/200?1" alt="Product">
            </div>
            <h3>Sản phẩm 1</h3>
            <p>500.000đ</p>
            <button>Mua ngay</button>
        </div>

        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/200?2" alt="Product">
            </div>
            <h3>Sản phẩm 2</h3>
            <p>700.000đ</p>
            <button>Mua ngay</button>
        </div>

        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/200?3" alt="Product">
            </div>
            <h3>Sản phẩm 3</h3>
            <p>900.000đ</p>
            <button>Mua ngay</button>
        </div>

        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/200?4" alt="Product">
            </div>
            <h3>Sản phẩm 4</h3>
            <p>1.200.000đ</p>
            <button>Mua ngay</button>
        </div>

    </section>

</body>
</html>
