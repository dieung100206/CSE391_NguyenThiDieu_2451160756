<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Multimedia</title>
</head>
<body>

    <h1>Giới thiệu sản phẩm</h1>

    <!-- SVG logo -->
    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" fill="blue" />
        <text x="50%" y="55%" text-anchor="middle" fill="white" font-size="20">TLU</text>
    </svg>

    <hr>

    <!-- ẢNH SẢN PHẨM -->
    <h2>Sản phẩm nổi bật</h2>

    <figure>
        <img src="images/iPhone16.jpg/300x200" 
             alt="iPhone 16 Pro màu đen mặt trước" 
             loading="lazy"
             style="max-width:100%; height:auto;">
        <figcaption>iPhone 16 Pro - Thiết kế sang trọng</figcaption>
    </figure>

    <figure>
        <img src="https://placehold.co/300x200" 
             alt="Laptop mỏng nhẹ màu bạc" 
             loading="lazy"
             style="max-width:100%; height:auto;">
        <figcaption>Laptop siêu mỏng - Hiệu năng cao</figcaption>
    </figure>

    <figure>
        <img src="https://placehold.co/300x200" 
             alt="Tai nghe không dây màu trắng" 
             loading="lazy"
             style="max-width:100%; height:auto;">
        <figcaption>Tai nghe Bluetooth - Âm thanh sống động</figcaption>
    </figure>

    <hr>

    <!-- VIDEO YOUTUBE -->
    <h2>Video giới thiệu (YouTube)</h2>

    <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="Video sản phẩm"
        frameborder="0"
        allowfullscreen>
    </iframe>

    <hr>

    <!-- VIDEO LOCAL -->
    <h2>Video sản phẩm (local)</h2>

    <video controls poster="https://placehold.co/600x300" width="600">
        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">
        Trình duyệt không hỗ trợ video.
    </video>

    <hr>

    <!-- AUDIO -->
    <h2>Nhạc nền</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        <source src="audio.ogg" type="audio/ogg">
        Trình duyệt không hỗ trợ audio.
    </audio>

</body>
</html>
